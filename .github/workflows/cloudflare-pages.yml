name: Deploy to Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare static website
        run: |
          mkdir -p "$RUNNER_TEMP/pages-site"
          cp index.html "$RUNNER_TEMP/pages-site/"
          cp -R js data docs "$RUNNER_TEMP/pages-site/"
      - name: Deploy to existing Cloudflare Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 8fe568474e60ea25d515ca9acdb557f3
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add repository secret CLOUDFLARE_API_TOKEN with Cloudflare Pages Edit permission for the target account."
            exit 1
          fi
          npx --yes wrangler@4.149.0 pages deploy "$RUNNER_TEMP/pages-site" --project-name mataian-dam-sediment-dashboard --branch main --commit-hash "$GITHUB_SHA"
